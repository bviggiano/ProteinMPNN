name: Test Pip Installation

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

jobs:
  test-pip-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: test-proteinmpnn

    - name: Verify minimal conda environment
      shell: bash -l {0}
      run: |
        echo "Conda environment packages:"
        conda list
        echo "Python version:"
        python --version

    - name: Install package with pip (including test dependencies)
      shell: bash -l {0}
      run: |
        pip install uv
        uv pip install -e ".[test]"
        echo "Package installed successfully"
        echo "Installed packages:"
        pip list

    - name: Rename local weight directories to prevent usage
      shell: bash -l {0}
      run: |
        echo "Renaming local weight directories to ensure pip-installed weights are used..."
        mv vanilla_model_weights vanilla_model_weights_DISABLED
        mv ca_model_weights ca_model_weights_DISABLED
        mv soluble_model_weights soluble_model_weights_DISABLED
        echo "Local weights disabled - only pip-installed weights available"

    - name: Run pytest
      shell: bash -l {0}
      env:
        CI: true
      run: |
        pytest tests/ -v --tb=short
